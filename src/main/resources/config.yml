# CUITicket configuration. Run /ticketadmin reload after editing (changing storage needs a restart).

storage:
  # sqlite: a file in the plugin folder (tickets.db), nothing to set up.
  # mysql:  for a database server. The drivers come with Spigot and Paper.
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: crossui_ticket
    username: root
    password: ""
  # Closed tickets that were not touched for this many days are deleted. 0 keeps everything.
  archive-after-days: 30

tickets:
  # How many tickets one player can have open at the same time.
  max-open-per-player: 3
  # Seconds between two tickets of the same player.
  cooldown-seconds: 300
  # Longest text a player can write (reason and replies).
  reason-max-length: 300
  # Tickets per page in lists.
  page-size: 10
  # How many of the latest replies are shown in a ticket.
  max-replies-shown: 5
  # Categories. "icon" is an item name for the button picture, "requires-target" asks for a player name.
  # Bedrock pictures need the item to exist in the CrossUI icon pack (see ui.icon-pack-url).
  categories:
    - id: PLAYER_REPORT
      label: "Player Report"
      icon: IRON_SWORD
      requires-target: true
    - id: BUG_REPORT
      label: "Bug Report"
      icon: SPIDER_EYE
      requires-target: false
    - id: SUGGESTION
      label: "Suggestion"
      icon: ENCHANTED_BOOK
      requires-target: false
    - id: QUESTION
      label: "Question"
      icon: BOOK
      requires-target: false

ui:
  # Item pictures on Bedrock buttons. The pictures are the icon pack of the CrossUI repository.
  icons: true
  icon-pack-url: "https://raw.githubusercontent.com/natan307/CrossUI/main/icons/"

notifications:
  # Tell staff with cuiticket.notify when a ticket is created.
  notify-admins-online: true
  # Tell the player when staff replies to or closes their ticket (offline players are told when they join).
  notify-player-on-reply: true
  notify-player-on-close: true
  # Sound played with a notification. Leave empty for none.
  sound: "entity.experience_orb.pickup"
  # Seconds after joining before the join messages are shown.
  join-delay-seconds: 3
  # Waiting tickets listed to staff when they join.
  join-list-max: 5

metrics:
  # bStats, anonymous (storage type and ticket counts). No player data is sent.
  enabled: true

